# Netlify配置文件
[build]
  command = "bun install && bun run build"
  publish = "dist"

# 生产环境变量（在Netlify后台配置）
# VITE_API_URL = "https://your-api-domain.com/api"

# 重定向规则（SPA路由支持）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全头部
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"

# HTML页面 - 短缓存
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS - 长缓存
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片资源 - 长缓存
[[headers]]
  for = "/assets/*.{jpg,jpeg,png,webp,svg}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 字体文件 - 长缓存
[[headers]]
  for = "/assets/*.{woff,woff2,ttf}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker - 不缓存
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
