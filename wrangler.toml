# Cloudflare Pages configuration
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Binding usage examples for functions under functions/:
# export async function onRequest(context) {
#   const { env } = context;
#   // KV: await env.KV.get('key')
#   // D1: await env.DB.prepare('SELECT * FROM users').all()
#   // R2: await env.BUCKET.get('file.jpg')
#   // AI: await env.AI.run('@cf/meta/llama-2-7b-chat-int8', { prompt: 'Hello' })
# }

name = "hmrchan-frontend"
compatibility_date = "2026-08-24"
pages_build_output_dir = "./dist"

# Cloudflare Pages does not support a [build] section in wrangler.toml.
# Configure the build command in Cloudflare Dashboard > Pages > Settings > Builds & deployments.
# Recommended: bun install --frozen-lockfile && VITE_GIT_COMMIT=$CF_PAGES_COMMIT_SHA bun run build
# When VITE_CLIENT_CONTRACT_VERSION is absent from the Dashboard, the repository build wrapper uses
# CF_PAGES_COMMIT_SHA as the rollout contract only inside the Cloudflare Pages environment.

# ============================================================================
# Production environment
# ============================================================================

# Pages Functions connect to the internal API gateway Worker through a supported Service Binding.
# That Worker owns VPC and private-upstream access.
[[env.production.services]]
binding = "INTERNAL_API_GATEWAY"
service = "hmrchan-internal-api-gateway-production"

[env.production.vars]
# Bun-only build: pin Bun and disable automatic npm dependency installation
BUN_VERSION = "1.4.0"
SKIP_DEPENDENCY_INSTALL = "true"
# Pages Functions runtime variables for the proxy target
# Production browser traffic reaches the backend through same-origin /api -> Pages Functions -> upstream
API_BASE_URL = "https://api.momichan.com"
ENABLE_INTERNAL_API_GATEWAY = "true"
GOOGLE_AUTH_ENABLED = "true"
VITE_CLIENT_CONTRACT_VERSION = "2026-04-13.p1"

# ============================================================================
# Preview environment
# ============================================================================
[env.preview.vars]
BUN_VERSION = "1.4.0"
SKIP_DEPENDENCY_INSTALL = "true"
API_BASE_URL = "https://api.momichan.com"
ENABLE_INTERNAL_API_GATEWAY = "true"
GOOGLE_AUTH_ENABLED = "true"
VITE_CLIENT_CONTRACT_VERSION = "2026-04-13.p1"

[[env.preview.services]]
binding = "INTERNAL_API_GATEWAY"
service = "hmrchan-internal-api-gateway-preview"

# ============================================================================
# Bindings
# ============================================================================
# The following binding examples remain commented until required.

# --- KV namespaces ---
# [[env.production.kv_namespaces]]
# binding = "KV"  # Access through env.KV
# id = "your_kv_namespace_id"

# [[env.preview.kv_namespaces]]
# binding = "KV"
# id = "your_preview_kv_namespace_id"

# --- D1 databases (SQLite) ---
# [[env.production.d1_databases]]
# binding = "DB"  # Access through env.DB
# database_name = "your_database_name"
# database_id = "your_database_id"

# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "your_preview_database_name"
# database_id = "your_preview_database_id"

# --- R2 buckets (object storage) ---
# [[env.production.r2_buckets]]
# binding = "BUCKET"  # Access through env.BUCKET
# bucket_name = "your_bucket_name"

# [[env.preview.r2_buckets]]
# binding = "BUCKET"
# bucket_name = "your_preview_bucket_name"

# --- Durable Objects ---
# [[env.production.durable_objects.bindings]]
# name = "MY_DURABLE_OBJECT"
# class_name = "MyDurableObject"
# script_name = "my-worker"

# --- Workers AI ---
# [env.production.ai]
# binding = "AI"  # Access through env.AI

# [env.preview.ai]
# binding = "AI"

# --- Vectorize databases ---
# [[env.production.vectorize]]
# binding = "VECTORIZE"
# index_name = "your_index_name"

# [[env.preview.vectorize]]
# binding = "VECTORIZE"
# index_name = "your_preview_index_name"

# --- Queues ---
# [[env.production.queues.producers]]
# binding = "MY_QUEUE"
# queue = "your_queue_name"

# [[env.production.queues.consumers]]
# queue = "your_queue_name"
# max_batch_size = 10
# max_batch_timeout = 30

# --- Service Bindings for other Workers ---
# [[env.production.services]]
# binding = "MY_SERVICE"
# service = "my-worker-name"
# environment = "production"

# --- Analytics Engine ---
# [[env.production.analytics_engine_datasets]]
# binding = "ANALYTICS"
