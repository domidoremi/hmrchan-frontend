# Cloudflare Pages 配置
# 参考：https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "hmrchan-frontend"
compatibility_date = "2024-12-09"
pages_build_output_dir = "./dist"

# 注意：Cloudflare Pages 不支持在 wrangler.toml 中配置 [build]
# 构建命令需要在 Cloudflare Dashboard > Pages > Settings > Builds & deployments 中配置
# 推荐构建命令：bun run build

# ============================================================================
# Production 环境配置
# ============================================================================
[env.production.vars]
# 构建时环境变量（会被 Vite 注入到前端代码中）
VITE_API_BASE_URL = "https://api.momichan.xyz"
VITE_API_ENDPOINT = "/api/v1"
VITE_API_URL = "/api"
VITE_APP_NAME = "MomiChan"
VITE_APP_DESCRIPTION = "Image and video content community"
VITE_ENABLE_DEBUG = "false"
VITE_ENABLE_DEVTOOLS = "false"

# Functions 运行时变量（用于 functions/ 目录中的边缘函数）
API_BASE_URL = "https://api.momichan.xyz"

# ============================================================================
# Preview 环境配置
# ============================================================================
[env.preview.vars]
# 构建时环境变量（会被 Vite 注入到前端代码中）
VITE_API_BASE_URL = "https://api.momichan.xyz"
VITE_API_ENDPOINT = "/api/v1"
VITE_API_URL = "/api"
VITE_APP_NAME = "MomiChan (Preview)"
VITE_APP_DESCRIPTION = "Image and video content community"
VITE_ENABLE_DEBUG = "true"
VITE_ENABLE_DEVTOOLS = "true"

# Functions 运行时变量（用于 functions/ 目录中的边缘函数）
API_BASE_URL = "https://api.momichan.xyz"

# ============================================================================
# 机密变量（Secrets）
# ============================================================================
# 敏感信息如 API 密钥应该通过 Cloudflare Dashboard 添加为 Secret
# 例如：VITE_TURNSTILE_SITE_KEY
# 在 Dashboard > Settings > Environment variables > Add variable > Type: Secret
