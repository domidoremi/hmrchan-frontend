# Cloudflare Pages 配置
# 参考：https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# 绑定使用示例（在 functions/ 目录的函数中）：
# export async function onRequest(context) {
#   const { env } = context;
#   // 访问 KV: await env.KV.get('key')
#   // 访问 D1: await env.DB.prepare('SELECT * FROM users').all()
#   // 访问 R2: await env.BUCKET.get('file.jpg')
#   // 访问 AI: await env.AI.run('@cf/meta/llama-2-7b-chat-int8', { prompt: 'Hello' })
# }

name = "hmrchan-frontend"
compatibility_date = "2024-12-09"
pages_build_output_dir = "./dist"

# 注意：Cloudflare Pages 不支持在 wrangler.toml 中配置 [build]
# 构建命令需要在 Cloudflare Dashboard > Pages > Settings > Builds & deployments 中配置
# 推荐构建命令：bun install --frozen-lockfile && VITE_GIT_COMMIT=$CF_PAGES_COMMIT_SHA bun run build
# 若 Dashboard 未显式配置 VITE_CLIENT_CONTRACT_VERSION，仓库 build wrapper 仅在
# Cloudflare Pages 环境中使用 CF_PAGES_COMMIT_SHA 作为本次 rollout contract。

# ============================================================================
# Production 环境配置
# ============================================================================

# Workers VPC Service 绑定（通过 Cloudflare Tunnel 私有访问后端 API）
[[env.production.vpc_services]]
binding = "VPC_SERVICE"
service_id = "019c954f-b5bf-7e81-aea7-fa4eb3e05cb9"
remote = true

[env.production.vars]
# 仅使用 Bun：显式指定 Bun 版本并禁用自动 npm 依赖安装
BUN_VERSION = "1.3.11"
SKIP_DEPENDENCY_INSTALL = "true"
# Pages Functions 运行时变量（代理目标地址）
# 浏览器端生产默认始终通过同源 /api -> Pages Functions -> upstream 访问后端
API_BASE_URL = "https://api.momichan.xyz"
# Pages Functions 在私网内按后端三域服务直连，避免依赖已退役的 nginx 单网关。
VPC_IDENTITY_API_ORIGIN = "http://identity-api:8000"
VPC_COMMUNITY_API_ORIGIN = "http://community-api:8000"
VPC_CONTENT_API_ORIGIN = "http://content-api:8000"
# 兼容未显式拆分的旧调用方；当前回落到 identity 域。
VPC_API_ORIGIN = "http://identity-api:8000"

# ============================================================================
# Preview 环境配置
# ============================================================================
[env.preview.vars]
BUN_VERSION = "1.3.11"
SKIP_DEPENDENCY_INSTALL = "true"
API_BASE_URL = "https://api.momichan.xyz"
VPC_IDENTITY_API_ORIGIN = "http://identity-api:8000"
VPC_COMMUNITY_API_ORIGIN = "http://community-api:8000"
VPC_CONTENT_API_ORIGIN = "http://content-api:8000"
VPC_API_ORIGIN = "http://identity-api:8000"

[[env.preview.vpc_services]]
binding = "VPC_SERVICE"
service_id = "019c954f-b5bf-7e81-aea7-fa4eb3e05cb9"
remote = true

# ============================================================================
# 绑定配置（Bindings）
# ============================================================================
# 以下是可用的绑定类型示例，根据实际需求取消注释并配置

# --- KV 命名空间（键值存储）---
# [[env.production.kv_namespaces]]
# binding = "KV"  # 在代码中通过 env.KV 访问
# id = "your_kv_namespace_id"

# [[env.preview.kv_namespaces]]
# binding = "KV"
# id = "your_preview_kv_namespace_id"

# --- D1 数据库（SQLite）---
# [[env.production.d1_databases]]
# binding = "DB"  # 在代码中通过 env.DB 访问
# database_name = "your_database_name"
# database_id = "your_database_id"

# [[env.preview.d1_databases]]
# binding = "DB"
# database_name = "your_preview_database_name"
# database_id = "your_preview_database_id"

# --- R2 存储桶（对象存储）---
# [[env.production.r2_buckets]]
# binding = "BUCKET"  # 在代码中通过 env.BUCKET 访问
# bucket_name = "your_bucket_name"

# [[env.preview.r2_buckets]]
# binding = "BUCKET"
# bucket_name = "your_preview_bucket_name"

# --- Durable Objects ---
# [[env.production.durable_objects.bindings]]
# name = "MY_DURABLE_OBJECT"
# class_name = "MyDurableObject"
# script_name = "my-worker"

# --- Workers AI ---
# [env.production.ai]
# binding = "AI"  # 在代码中通过 env.AI 访问

# [env.preview.ai]
# binding = "AI"

# --- Vectorize（向量数据库）---
# [[env.production.vectorize]]
# binding = "VECTORIZE"
# index_name = "your_index_name"

# [[env.preview.vectorize]]
# binding = "VECTORIZE"
# index_name = "your_preview_index_name"

# --- Queue（消息队列）---
# [[env.production.queues.producers]]
# binding = "MY_QUEUE"
# queue = "your_queue_name"

# [[env.production.queues.consumers]]
# queue = "your_queue_name"
# max_batch_size = 10
# max_batch_timeout = 30

# --- Service Bindings（调用其他 Worker）---
# [[env.production.services]]
# binding = "MY_SERVICE"
# service = "my-worker-name"
# environment = "production"

# --- Analytics Engine ---
# [[env.production.analytics_engine_datasets]]
# binding = "ANALYTICS"
