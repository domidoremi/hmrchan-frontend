# Cloudflare Pages 配置
# 参考：https://developers.cloudflare.com/pages/configuration/wrangler-configuration/

name = "hmrchan-frontend"
compatibility_date = "2024-12-09"
pages_build_output_dir = "./dist"

# 注意：Cloudflare Pages 不支持在 wrangler.toml 中配置 [build]
# 构建命令需要在 Cloudflare Dashboard > Pages > Settings > Builds & deployments 中配置
# 推荐构建命令：bun run build
# 或使用：bash scripts/cloudflare-build.sh（如果需要兼容 npm）

# 注意：以下变量已在 Cloudflare Dashboard 中配置，无需在此重复
# - VITE_API_BASE_URL
# - VITE_API_ENDPOINT  
# - VITE_API_URL
# - VITE_TURNSTILE_SITE_KEY (构建时变量，需在 Pages Settings 中配置)

# Functions 运行时变量（用于 API 代理）
[vars]
API_BASE_URL = "https://api.momichan.xyz"
