name: frontend

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Dependency review
        uses: actions/dependency-review-action@v4.9.0

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint:strict

      - name: Unit tests
        run: bun run test:unit

      - name: Dependency audit
        run: bun run audit

      - name: Production build
        run: bun run build

      - name: Build security checks
        run: bun run build:security-check

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.coverage.outputs.exit_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: coverage
        name: Coverage report (non-blocking)
        shell: bash
        run: |
          set +e
          bun run test:coverage
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-report
          path: |
            coverage/**
          if-no-files-found: ignore
          retention-days: 7

  e2e_smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    outputs:
      exit_code: ${{ steps.e2e.outputs.exit_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: e2e
        name: Smoke E2E (non-blocking)
        shell: bash
        run: |
          set +e
          bun run test:e2e
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

  quality_panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency_review
      - quality
      - coverage
      - e2e_smoke
    if: always()

    steps:
      - name: Publish quality panel
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEP_REVIEW_RESULT: ${{ needs.dependency_review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_EXIT: ${{ needs.coverage.outputs.exit_code }}
          E2E_EXIT: ${{ needs.e2e_smoke.outputs.exit_code }}
        run: |
          coverage_status="warn"
          if [ "${COVERAGE_EXIT}" = "0" ]; then
            coverage_status="pass"
          elif [ -z "${COVERAGE_EXIT}" ]; then
            coverage_status="not-run"
          fi

          e2e_status="warn"
          if [ "${E2E_EXIT}" = "0" ]; then
            e2e_status="pass"
          elif [ -z "${E2E_EXIT}" ]; then
            e2e_status="not-run"
          fi

          {
            echo "## Frontend quality panel"
            echo
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Dependency review | ${DEP_REVIEW_RESULT:-not-run} | [Workflow run](${RUN_URL}) |"
            echo "| Type check / Lint / Unit tests | ${QUALITY_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Coverage (non-blocking) | ${coverage_status} | [Workflow run](${RUN_URL}) · artifact: \`coverage-report\` |"
            echo "| Smoke E2E (non-blocking) | ${e2e_status} | [Workflow run](${RUN_URL}) |"
            echo "| A11y / Perf nightly | scheduled | See the nightly workflow for the latest artifacts and summaries. |"
            echo
            echo "> Coverage and smoke E2E are intentionally non-blocking while the repository is still closing historical gaps."
          } >> "$GITHUB_STEP_SUMMARY"
