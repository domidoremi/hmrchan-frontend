name: frontend

run-name: >-
  frontend · ${{
    github.event_name == 'pull_request'
      && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('{0} · {1}', github.event_name, github.ref_name)
  }}

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: 1.3.11
  VITE_CLIENT_CONTRACT_VERSION: ${{ vars.CLIENT_CONTRACT_VERSION || 'test-contract-hash' }}

defaults:
  run:
    shell: bash

jobs:
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.dep_review_outcome.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Dependency review
        id: dep_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4.9.0

      - name: Normalize dependency review result
        id: dep_review_outcome
        if: always()
        run: |
          if [ "${{ steps.dep_review.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.dep_review.outcome }}" = "failure" ]; then
            echo "status=unsupported" >> "$GITHUB_OUTPUT"
            {
              echo "## Dependency review"
              echo
              echo "Dependency review is not enforced for this repository because GitHub dependency review is unsupported without dependency graph and GitHub Advanced Security."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "status=${{ steps.dep_review.outcome }}" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint:strict

      - name: Unit tests
        run: bun run test:unit

      - name: Dependency audit
        run: bun run audit

      - name: Production build
        run: bun run build

      - name: Build security checks
        run: bun run build:security-check

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Coverage report
        run: bun run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-report
          path: |
            coverage/**
          if-no-files-found: ignore
          retention-days: 7

  quality_panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency_review
      - quality
      - coverage
    if: always()

    steps:
      - name: Publish quality panel
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEP_REVIEW_RESULT: ${{ needs.dependency_review.outputs.status || needs.dependency_review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          {
            echo "## Frontend quality panel"
            echo
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Dependency review | ${DEP_REVIEW_RESULT:-not-run} | [Workflow run](${RUN_URL}) |"
            echo "| Type check / Lint / Unit tests | ${QUALITY_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Coverage baseline gate | ${COVERAGE_RESULT} | [Workflow run](${RUN_URL}) · manual-only via \`workflow_dispatch\` · artifact: \`coverage-report\` |"
            echo "| Browser smoke / health / production canary | manual-local | Run \`bun run test:e2e\`, \`bun run check:frontend\`, \`bun run test:prod:regression --preflight\`, or \`node scripts/prod-regression-runner.mjs\` outside default GitHub Actions. |"
            echo "| A11y / Perf nightly | scheduled | See the nightly workflow for the latest artifacts and summaries. |"
            echo
            echo "> Default GitHub Actions now block only on the lightweight quality gate, plus manual coverage when explicitly dispatched. Heavy browser smoke, frontend health, and production canary moved out of the default workflow to reduce GitHub Actions usage; run the existing local/manual scripts against the controlled site or production before release. Pages production/preview auth still requires \`BACKEND_INTERNAL_ORIGIN\` and \`BACKEND_INTERNAL_AUTH_SHARED_SECRET\` to be configured so the same-origin BFF chain can authenticate correctly."
          } >> "$GITHUB_STEP_SUMMARY"
