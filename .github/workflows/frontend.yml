name: frontend

run-name: >-
  frontend · ${{
    github.event_name == 'pull_request'
      && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('{0} · {1}', github.event_name, github.ref_name)
  }}

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: 1.3.11
  VITE_CLIENT_CONTRACT_VERSION: ${{ vars.CLIENT_CONTRACT_VERSION || 'test-contract-hash' }}

defaults:
  run:
    shell: bash

jobs:
  dependency_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.dep_review_outcome.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Dependency review
        id: dep_review
        continue-on-error: true
        uses: actions/dependency-review-action@v4.9.0

      - name: Normalize dependency review result
        id: dep_review_outcome
        if: always()
        run: |
          if [ "${{ steps.dep_review.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.dep_review.outcome }}" = "failure" ]; then
            echo "status=unsupported" >> "$GITHUB_OUTPUT"
            {
              echo "## Dependency review"
              echo
              echo "Dependency review is not enforced for this repository because GitHub dependency review is unsupported without dependency graph and GitHub Advanced Security."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "status=${{ steps.dep_review.outcome }}" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint:strict

      - name: Unit tests
        run: bun run test:unit

      - name: Dependency audit
        run: bun run audit

      - name: Production build
        run: bun run build

      - name: Build security checks
        run: bun run build:security-check

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Coverage report
        run: bun run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-report
          path: |
            coverage/**
          if-no-files-found: ignore
          retention-days: 7

  e2e_smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate controlled smoke API upstream
        env:
          SMOKE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          SMOKE_IDENTITY_API_BASE_URL: ${{ vars.SMOKE_IDENTITY_API_BASE_URL || '' }}
          SMOKE_COMMUNITY_API_BASE_URL: ${{ vars.SMOKE_COMMUNITY_API_BASE_URL || '' }}
          SMOKE_CONTENT_API_BASE_URL: ${{ vars.SMOKE_CONTENT_API_BASE_URL || '' }}
        run: |
          if [ -z "${SMOKE_API_BASE_URL}" ] && [ -z "${SMOKE_IDENTITY_API_BASE_URL}" ] && [ -z "${SMOKE_COMMUNITY_API_BASE_URL}" ] && [ -z "${SMOKE_CONTENT_API_BASE_URL}" ]; then
            echo "::error::Protected CI smoke requires a controlled frontend/API upstream. Set SMOKE_API_BASE_URL to the controlled site origin that serves same-origin /api (recommended), or set the split-domain API variants."
            exit 1
          fi

      - name: Smoke E2E
        env:
          E2E_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          E2E_AUTOSTART: 'false'
          E2E_ARTIFACT_DIR: .e2e-smoke
          E2E_REQUIRE_AUTH: 'true'
          LOCAL_AUDIT_AUTO_API_BRIDGE: 'false'
          VITE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          VITE_IDENTITY_API_BASE_URL: ${{ vars.SMOKE_IDENTITY_API_BASE_URL || '' }}
          VITE_COMMUNITY_API_BASE_URL: ${{ vars.SMOKE_COMMUNITY_API_BASE_URL || '' }}
          VITE_CONTENT_API_BASE_URL: ${{ vars.SMOKE_CONTENT_API_BASE_URL || '' }}
          PRIMARY_USERNAME: ${{ secrets.PRIMARY_USERNAME || secrets.E2E_AUTH_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.PRIMARY_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
          REHEARSAL_TURNSTILE_BYPASS_TOKEN: ${{ secrets.REHEARSAL_TURNSTILE_BYPASS_TOKEN || vars.REHEARSAL_TURNSTILE_BYPASS_TOKEN || '' }}
        run: |
          mkdir -p .e2e-smoke
          status=0
          bun run test:e2e || status=$?
          if [ -f .e2e-smoke/summary.md ]; then
            cat .e2e-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload smoke E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: e2e-smoke
          path: |
            .e2e-smoke/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  frontend_health:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate controlled smoke API upstream
        env:
          SMOKE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          SMOKE_IDENTITY_API_BASE_URL: ${{ vars.SMOKE_IDENTITY_API_BASE_URL || '' }}
          SMOKE_COMMUNITY_API_BASE_URL: ${{ vars.SMOKE_COMMUNITY_API_BASE_URL || '' }}
          SMOKE_CONTENT_API_BASE_URL: ${{ vars.SMOKE_CONTENT_API_BASE_URL || '' }}
        run: |
          if [ -z "${SMOKE_API_BASE_URL}" ] && [ -z "${SMOKE_IDENTITY_API_BASE_URL}" ] && [ -z "${SMOKE_COMMUNITY_API_BASE_URL}" ] && [ -z "${SMOKE_CONTENT_API_BASE_URL}" ]; then
            echo "::error::Protected frontend health requires a controlled frontend/API upstream. Set SMOKE_API_BASE_URL to the controlled site origin that serves same-origin /api (recommended), or set the split-domain API variants."
            exit 1
          fi

      - name: Frontend health smoke
        env:
          FRONTEND_HEALTH_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          FRONTEND_HEALTH_AUTOSTART: 'false'
          FRONTEND_HEALTH_ARTIFACT_DIR: .frontend-health
          FRONTEND_HEALTH_REQUIRE_AUTH: 'true'
          LOCAL_AUDIT_AUTO_API_BRIDGE: 'false'
          VITE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          VITE_IDENTITY_API_BASE_URL: ${{ vars.SMOKE_IDENTITY_API_BASE_URL || '' }}
          VITE_COMMUNITY_API_BASE_URL: ${{ vars.SMOKE_COMMUNITY_API_BASE_URL || '' }}
          VITE_CONTENT_API_BASE_URL: ${{ vars.SMOKE_CONTENT_API_BASE_URL || '' }}
          PRIMARY_USERNAME: ${{ secrets.PRIMARY_USERNAME || secrets.E2E_AUTH_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.PRIMARY_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
          REHEARSAL_TURNSTILE_BYPASS_TOKEN: ${{ secrets.REHEARSAL_TURNSTILE_BYPASS_TOKEN || vars.REHEARSAL_TURNSTILE_BYPASS_TOKEN || '' }}
        run: |
          mkdir -p .frontend-health
          status=0
          bun run check:frontend 2>&1 | tee .frontend-health/report.txt || status=$?
          if [ -f .frontend-health/summary.md ]; then
            cat .frontend-health/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload frontend health artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: frontend-health
          path: |
            .frontend-health/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  production_canary:
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'master') &&
      (vars.PRODUCTION_CANARY_BASE_URL != '' || vars.PROTECTED_CANARY_BASE_URL != '')
    runs-on: ubuntu-latest
    needs:
      - quality
      - coverage
      - e2e_smoke
      - frontend_health
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for Pages production rollout
        run: sleep 180

      - name: Production frontend health canary
        env:
          FRONTEND_HEALTH_BASE_URL: ${{ vars.PRODUCTION_CANARY_BASE_URL || vars.PROTECTED_CANARY_BASE_URL }}
          FRONTEND_HEALTH_AUTOSTART: 'false'
          FRONTEND_HEALTH_INCLUDE_API_ERRORS: 'true'
          FRONTEND_HEALTH_ARTIFACT_DIR: .frontend-health-prod
          PRIMARY_USERNAME: ${{ secrets.PRIMARY_USERNAME || secrets.E2E_AUTH_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.PRIMARY_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
        run: |
          mkdir -p .frontend-health-prod
          status=0
          bun run check:frontend 2>&1 | tee .frontend-health-prod/report.txt || status=$?
          if [ -f .frontend-health-prod/summary.md ]; then
            cat .frontend-health-prod/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Production smoke canary
        env:
          E2E_BASE_URL: ${{ vars.PRODUCTION_CANARY_BASE_URL || vars.PROTECTED_CANARY_BASE_URL }}
          E2E_AUTOSTART: 'false'
          E2E_ARTIFACT_DIR: .e2e-smoke-prod
          E2E_REQUIRE_AUTH: 'true'
          PRIMARY_USERNAME: ${{ secrets.PRIMARY_USERNAME || secrets.E2E_AUTH_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.PRIMARY_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
        run: |
          mkdir -p .e2e-smoke-prod
          status=0
          bun run test:e2e || status=$?
          if [ -f .e2e-smoke-prod/summary.md ]; then
            cat .e2e-smoke-prod/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload production canary artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: production-canary
          path: |
            .frontend-health-prod/**
            .e2e-smoke-prod/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  quality_panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency_review
      - quality
      - coverage
      - e2e_smoke
      - frontend_health
    if: always()

    steps:
      - name: Publish quality panel
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEP_REVIEW_RESULT: ${{ needs.dependency_review.outputs.status || needs.dependency_review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          E2E_RESULT: ${{ needs.e2e_smoke.result }}
          HEALTH_RESULT: ${{ needs.frontend_health.result }}
        run: |
          {
            echo "## Frontend quality panel"
            echo
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Dependency review | ${DEP_REVIEW_RESULT:-not-run} | [Workflow run](${RUN_URL}) |"
            echo "| Type check / Lint / Unit tests | ${QUALITY_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Coverage baseline gate | ${COVERAGE_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`coverage-report\` |"
            echo "| Smoke E2E (auth fixture required) | ${E2E_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Frontend health smoke (auth fixture required) | ${HEALTH_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`frontend-health\` |"
            echo "| A11y / Perf nightly | scheduled | See the nightly workflow for the latest artifacts and summaries. |"
            echo
            echo "> Blocking gates now cover quality, coverage baseline, smoke E2E, and preview-shell frontend health with the shared smoke fixture account plus a controlled frontend/API upstream. Prefer setting \`SMOKE_API_BASE_URL\` to a controlled site origin that exposes same-origin \`/api\` via Pages Functions; only fall back to split-domain API vars when that topology is intentionally direct. Pushes to \`main\` only trigger production canary when \`PRODUCTION_CANARY_BASE_URL\` or \`PROTECTED_CANARY_BASE_URL\` is configured. High-risk comment/profile/device/favorite changes should still run \`bun run check:release-evidence\` or at minimum \`bun run test:prod:regression --preflight\` before release, and CI-noise warnings that affect result reading must be fixed or explicitly documented."
          } >> "$GITHUB_STEP_SUMMARY"
