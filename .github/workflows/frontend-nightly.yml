name: frontend-nightly

run-name: >-
  frontend-nightly · ${{
    github.event_name == 'schedule'
      && 'scheduled'
      || format('manual · {0}', github.ref_name)
  }}

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: 1.3.11

defaults:
  run:
    shell: bash

jobs:
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run audit

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Accessibility audit
        run: bun run test:a11y

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lighthouse-a11y
          path: |
            .lighthouse-a11y/**
          if-no-files-found: ignore
          retention-days: 14

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Performance audit
        run: bun run test:perf

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lighthouse-perf
          path: |
            .lighthouse/**
          if-no-files-found: ignore
          retention-days: 14

  pwa_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PWA / E2E smoke
        run: bun run test:e2e

  frontend_health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      exit_code: ${{ steps.frontend_health.outputs.exit_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: frontend_health
        name: Frontend health smoke (non-blocking)
        shell: bash
        run: |
          mkdir -p .frontend-health
          set +e
          bun run check:frontend 2>&1 | tee .frontend-health/report.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload frontend health artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: frontend-health
          path: |
            .frontend-health/**
          if-no-files-found: ignore
          retention-days: 14

  nightly_panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency_audit
      - accessibility
      - performance
      - pwa_smoke
      - frontend_health
    if: always()

    steps:
      - name: Publish nightly panel
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_RESULT: ${{ needs.dependency_audit.result }}
          A11Y_RESULT: ${{ needs.accessibility.result }}
          PERF_RESULT: ${{ needs.performance.result }}
          PWA_RESULT: ${{ needs.pwa_smoke.result }}
          HEALTH_EXIT: ${{ needs.frontend_health.outputs.exit_code }}
        run: |
          health_status="warn"
          if [ "${HEALTH_EXIT}" = "0" ]; then
            health_status="pass"
          elif [ -z "${HEALTH_EXIT}" ]; then
            health_status="not-run"
          fi

          {
            echo "## Frontend nightly panel"
            echo
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Dependency audit | ${AUDIT_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Accessibility audit | ${A11Y_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`lighthouse-a11y\` |"
            echo "| Performance audit | ${PERF_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`lighthouse-perf\` |"
            echo "| PWA / E2E smoke | ${PWA_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Frontend health smoke (non-blocking) | ${health_status} | [Workflow run](${RUN_URL}) · artifact: \`frontend-health\` |"
            echo
            echo "> Frontend health smoke is currently non-blocking because preview-based CI still reports known \`/client-report\` noise. Keep using the uploaded artifact to track regressions while the health probe is being hardened."
          } >> "$GITHUB_STEP_SUMMARY"
