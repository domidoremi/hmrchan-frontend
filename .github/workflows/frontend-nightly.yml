name: frontend-nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run audit

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Accessibility audit
        run: bun run test:a11y

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lighthouse-a11y
          path: |
            .lighthouse-a11y/**
          if-no-files-found: ignore
          retention-days: 14

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Performance audit
        run: bun run test:perf

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lighthouse-perf
          path: |
            .lighthouse/**
          if-no-files-found: ignore
          retention-days: 14

  pwa_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: PWA / E2E smoke
        run: bun run test:e2e

  nightly_panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency_audit
      - accessibility
      - performance
      - pwa_smoke
    if: always()

    steps:
      - name: Publish nightly panel
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_RESULT: ${{ needs.dependency_audit.result }}
          A11Y_RESULT: ${{ needs.accessibility.result }}
          PERF_RESULT: ${{ needs.performance.result }}
          PWA_RESULT: ${{ needs.pwa_smoke.result }}
        run: |
          {
            echo "## Frontend nightly panel"
            echo
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Dependency audit | ${AUDIT_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Accessibility audit | ${A11Y_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`lighthouse-a11y\` |"
            echo "| Performance audit | ${PERF_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`lighthouse-perf\` |"
            echo "| PWA / E2E smoke | ${PWA_RESULT} | [Workflow run](${RUN_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
