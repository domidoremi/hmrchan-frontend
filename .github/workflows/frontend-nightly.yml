name: frontend-nightly

run-name: >-
  frontend-nightly · ${{
    github.event_name == 'schedule'
      && 'scheduled'
      || format('manual · {0}', github.ref_name)
  }}

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: 1.3.11
  VITE_CLIENT_CONTRACT_VERSION: ${{ vars.CLIENT_CONTRACT_VERSION || 'test-contract-hash' }}

defaults:
  run:
    shell: bash

jobs:
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run audit

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Accessibility audit
        run: bun run test:a11y

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lighthouse-a11y
          path: |
            .lighthouse-a11y/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Performance audit
        run: bun run test:perf

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: lighthouse-perf
          path: |
            .lighthouse/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  pwa_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate controlled smoke API upstream
        env:
          SMOKE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          SMOKE_IDENTITY_API_BASE_URL: ${{ vars.SMOKE_IDENTITY_API_BASE_URL || '' }}
          SMOKE_COMMUNITY_API_BASE_URL: ${{ vars.SMOKE_COMMUNITY_API_BASE_URL || '' }}
          SMOKE_CONTENT_API_BASE_URL: ${{ vars.SMOKE_CONTENT_API_BASE_URL || '' }}
        run: |
          if [ -z "${SMOKE_API_BASE_URL}" ] && [ -z "${SMOKE_IDENTITY_API_BASE_URL}" ] && [ -z "${SMOKE_COMMUNITY_API_BASE_URL}" ] && [ -z "${SMOKE_CONTENT_API_BASE_URL}" ]; then
            echo "::error::Nightly protected smoke requires a controlled frontend/API upstream. Set SMOKE_API_BASE_URL to the controlled site origin that serves same-origin /api (recommended), or set the split-domain API variants."
            exit 1
          fi

      - name: PWA / E2E smoke
        env:
          E2E_ARTIFACT_DIR: .e2e-smoke-nightly
          E2E_REQUIRE_AUTH: 'true'
          LOCAL_AUDIT_AUTO_API_BRIDGE: 'false'
          VITE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || '' }}
          VITE_IDENTITY_API_BASE_URL: ${{ vars.SMOKE_IDENTITY_API_BASE_URL || '' }}
          VITE_COMMUNITY_API_BASE_URL: ${{ vars.SMOKE_COMMUNITY_API_BASE_URL || '' }}
          VITE_CONTENT_API_BASE_URL: ${{ vars.SMOKE_CONTENT_API_BASE_URL || '' }}
          PRIMARY_USERNAME: ${{ secrets.PRIMARY_USERNAME || secrets.E2E_AUTH_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.PRIMARY_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
        run: |
          mkdir -p .e2e-smoke-nightly
          status=0
          bun run test:e2e || status=$?
          if [ -f .e2e-smoke-nightly/summary.md ]; then
            cat .e2e-smoke-nightly/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload nightly smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: e2e-smoke-nightly
          path: |
            .e2e-smoke-nightly/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  frontend_health:
    if: ${{ vars.NIGHTLY_FRONTEND_HEALTH_BASE_URL != '' || vars.PRODUCTION_CANARY_BASE_URL != '' || vars.PROTECTED_CANARY_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production frontend health canary
        env:
          FRONTEND_HEALTH_BASE_URL: ${{ vars.NIGHTLY_FRONTEND_HEALTH_BASE_URL || vars.PRODUCTION_CANARY_BASE_URL || vars.PROTECTED_CANARY_BASE_URL }}
          FRONTEND_HEALTH_AUTOSTART: 'false'
          FRONTEND_HEALTH_INCLUDE_API_ERRORS: 'true'
          FRONTEND_HEALTH_ARTIFACT_DIR: .frontend-health
          FRONTEND_HEALTH_REQUIRE_AUTH: 'true'
          PRIMARY_USERNAME: ${{ secrets.PRIMARY_USERNAME || secrets.E2E_AUTH_LOGIN }}
          PRIMARY_PASSWORD: ${{ secrets.PRIMARY_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
        run: |
          mkdir -p .frontend-health
          status=0
          bun run check:frontend 2>&1 | tee .frontend-health/report.txt || status=$?
          if [ -f .frontend-health/summary.md ]; then
            cat .frontend-health/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload frontend health artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: frontend-health
          path: |
            .frontend-health/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  nightly_panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - dependency_audit
      - accessibility
      - performance
      - pwa_smoke
      - frontend_health
    if: always()

    steps:
      - name: Publish nightly panel
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_RESULT: ${{ needs.dependency_audit.result }}
          A11Y_RESULT: ${{ needs.accessibility.result }}
          PERF_RESULT: ${{ needs.performance.result }}
          PWA_RESULT: ${{ needs.pwa_smoke.result }}
          HEALTH_RESULT: ${{ needs.frontend_health.result }}
        run: |
          {
            echo "## Frontend nightly panel"
            echo
            echo "| Check | Status | Details |"
            echo "| --- | --- | --- |"
            echo "| Dependency audit | ${AUDIT_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Accessibility audit | ${A11Y_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`lighthouse-a11y\` |"
            echo "| Performance audit | ${PERF_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`lighthouse-perf\` |"
            echo "| PWA / E2E smoke (local preview shell, auth required) | ${PWA_RESULT} | [Workflow run](${RUN_URL}) |"
            echo "| Production frontend health canary | ${HEALTH_RESULT} | [Workflow run](${RUN_URL}) · artifact: \`frontend-health\` |"
            echo
            echo "> Nightly keeps E2E on the local preview shell for build-time/PWA parity, requires the seeded auth smoke account, and now expects a controlled frontend/API upstream instead of silently falling back to the raw public API. Prefer \`SMOKE_API_BASE_URL\` pointed at a controlled site origin that exposes same-origin \`/api\`; use split-domain API vars only when that topology is intentionally direct. Production-like health only runs when \`NIGHTLY_FRONTEND_HEALTH_BASE_URL\`, \`PRODUCTION_CANARY_BASE_URL\`, or \`PROTECTED_CANARY_BASE_URL\` is configured. Use \`bun run check:release-evidence\` or manual \`bun run test:prod:regression --preflight\` for high-risk write-adjacent changes, and treat tooling warnings that pollute diagnosis as defects until fixed or explicitly documented."
          } >> "$GITHUB_STEP_SUMMARY"
