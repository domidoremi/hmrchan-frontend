openapi: 3.1.0
info:
  title: HMRChan Identity / Account / Security
  version: wave1-final
  description: |
    Canonical checked-in contract artifact for the Identity / Account / Security domain.
    All protected `/api/v1/*` consumers send `X-Client-Contract-Version`; the server returns
    `X-Server-Contract-Version` and may reject mismatches with `426 Upgrade Required`.
    `PATCH` operations in this domain use JSON Merge Patch (RFC 7396). `/api/v1/preferences`
    keeps `GET/PUT/PATCH/DELETE`; `PATCH` is the canonical partial-update contract and `PUT`
    remains documented as a legacy whole-resource compatibility write.
servers:
  - url: /
tags:
  - name: client
  - name: auth
  - name: preferences
  - name: profile
  - name: devices
  - name: account
  - name: two-factor
  - name: email
  - name: upload
  - name: audit
paths:
  /api/v1/client/init:
    post:
      tags: [client]
      summary: Initialize client security bootstrap state
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/client/verify:
    post:
      tags: [client]
      summary: Complete client bootstrap verification
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/client/status:
    get:
      tags: [client]
      summary: Inspect current client verification status
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/turnstile-config:
    get:
      tags: [auth]
      summary: Get public Turnstile configuration
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/google/start:
    get:
      tags: [auth]
      summary: Start Google OAuth login or registration
      security: []
      parameters:
        - name: intent
          in: query
          schema:
            type: string
            enum: [login, register]
        - name: return_to
          in: query
          schema:
            type: string
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
  /api/v1/auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth callback handoff entry
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
  /api/v1/auth/google/exchange:
    post:
      tags: [auth]
      summary: Exchange Google handoff code for login outcome
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a local account
      security: []
      responses:
        "201": { $ref: "#/components/responses/CreatedEnvelope" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with local credentials
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/verify-risk-login:
    post:
      tags: [auth]
      summary: Complete risk-login challenge
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token with refresh cookie
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/heartbeat:
    post:
      tags: [auth]
      summary: Refresh session liveness metadata
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Return current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/auth/verify-password:
    post:
      tags: [auth]
      summary: Verify current password for sensitive flows
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/auth/verify-identity:
    post:
      tags: [auth]
      summary: Verify current user identity for sensitive flows
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: List active sessions for the current account
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke an active session by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/preferences:
    get:
      tags: [preferences]
      summary: Read account personalization preferences
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
    put:
      tags: [preferences]
      summary: Legacy compatibility write for the full preference resource
      description: This method remains supported for compatibility; new semantics must land on PATCH.
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
    patch:
      tags: [preferences]
      summary: Canonical partial update for account personalization preferences
      description: Uses JSON Merge Patch semantics.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonMergePatch"
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
    delete:
      tags: [preferences]
      summary: Reset account personalization preferences to defaults
      security:
        - bearerAuth: []
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/users/me/profile:
    get:
      tags: [profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
    patch:
      tags: [profile]
      summary: Patch current user profile
      description: Uses JSON Merge Patch semantics.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/JsonMergePatch"
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/users/me/change-password:
    post:
      tags: [profile]
      summary: Change current user password
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/devices:
    get:
      tags: [devices]
      summary: List devices bound to the current account
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
    delete:
      tags: [devices]
      summary: Revoke all secondary devices
      security:
        - bearerAuth: []
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/devices/current:
    get:
      tags: [devices]
      summary: Inspect the current device fingerprint and trust state
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/devices/trust:
    post:
      tags: [devices]
      summary: Mark current device as trusted
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/devices/untrust:
    post:
      tags: [devices]
      summary: Remove current device from the trusted set
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/devices/rename:
    post:
      tags: [devices]
      summary: Rename a remembered device
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/devices/{id}:
    delete:
      tags: [devices]
      summary: Revoke a remembered device by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/account/restore:
    post:
      tags: [account]
      summary: Restore a soft-deleted account
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/account/data-summary:
    get:
      tags: [account]
      summary: Return current user data summary counters
      description: The `notifications` field is still returned for frontend compatibility but is sourced from Inbox.
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/account/export-data:
    post:
      tags: [account]
      summary: Trigger user data export
      security:
        - bearerAuth: []
      responses:
        "202": { $ref: "#/components/responses/AcceptedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/account/deletion-status:
    get:
      tags: [account]
      summary: Read current account deletion state
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/account/delete:
    post:
      tags: [account]
      summary: Schedule or confirm account deletion
      security:
        - bearerAuth: []
      responses:
        "202": { $ref: "#/components/responses/AcceptedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/verify-login:
    post:
      tags: [two-factor]
      summary: Complete MFA step during login
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/2fa/webauthn/authenticate/options:
    post:
      tags: [two-factor]
      summary: Get WebAuthn authentication challenge
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/2fa/webauthn/authenticate/verify:
    post:
      tags: [two-factor]
      summary: Verify WebAuthn authentication assertion
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/2fa/status:
    get:
      tags: [two-factor]
      summary: Inspect MFA enrollment state
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/setup:
    post:
      tags: [two-factor]
      summary: Start TOTP enrollment
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/verify:
    post:
      tags: [two-factor]
      summary: Verify TOTP enrollment
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/disable:
    post:
      tags: [two-factor]
      summary: Disable MFA for the current account
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/regenerate-backup-codes:
    post:
      tags: [two-factor]
      summary: Regenerate MFA backup codes
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/webauthn/register/options:
    post:
      tags: [two-factor]
      summary: Get WebAuthn registration challenge
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/2fa/webauthn/register/verify:
    post:
      tags: [two-factor]
      summary: Verify WebAuthn registration response
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/email/send-registration-code:
    post:
      tags: [email]
      summary: Send email verification code for local registration
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/email/verify-email:
    post:
      tags: [email]
      summary: Verify an email verification code
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/email/request-password-reset:
    post:
      tags: [email]
      summary: Request password reset
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/email/reset-password:
    post:
      tags: [email]
      summary: Complete password reset
      security: []
      responses:
        "200": { $ref: "#/components/responses/SuccessEnvelope" }
  /api/v1/email/send-verification-email:
    post:
      tags: [email]
      summary: Send verification email for current account
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/email/send-change-password-code:
    post:
      tags: [email]
      summary: Send code for password change confirmation
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/email/change-password:
    post:
      tags: [email]
      summary: Change password through email verification
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/email/send-change-email-code:
    post:
      tags: [email]
      summary: Send code for email address change
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/email/change-email:
    post:
      tags: [email]
      summary: Change primary email address
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/upload/avatar:
    post:
      tags: [upload]
      summary: Upload current user avatar
      security:
        - bearerAuth: []
      responses:
        "201": { $ref: "#/components/responses/CreatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/audit/my-activity:
    get:
      tags: [audit]
      summary: List current user audit activity
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
  /api/v1/audit/my-security-summary:
    get:
      tags: [audit]
      summary: Get current user security summary
      security:
        - bearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/AuthenticatedEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
  headers:
    X-Server-Contract-Version:
      description: Current backend contract version expected by the Web client.
      schema:
        type: string
    X-Client-Upgrade-Required:
      description: Present and set to `true` when the request is rejected with `426 Upgrade Required`.
      schema:
        type: string
  requestBodies:
    JsonMergePatch:
      required: true
      content:
        application/merge-patch+json:
          schema:
            type: object
            additionalProperties: true
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    SuccessEnvelope:
      description: Successful JSON envelope.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    AuthenticatedEnvelope:
      description: Successful authenticated JSON envelope.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    CreatedEnvelope:
      description: Created JSON envelope.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    AcceptedEnvelope:
      description: Accepted JSON envelope.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    NoContent:
      description: Successful operation without response body.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
    Redirect:
      description: Redirect to the next step in the authentication flow.
      headers:
        Location:
          schema:
            type: string
    BadRequest:
      description: Request validation failure.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication required or session invalid.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpgradeRequired:
      description: Client contract version mismatch. Frontend must hard reload before retrying.
      headers:
        X-Server-Contract-Version:
          $ref: "#/components/headers/X-Server-Contract-Version"
        X-Client-Upgrade-Required:
          $ref: "#/components/headers/X-Client-Upgrade-Required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"
    Meta:
      type: object
      properties:
        api_version:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
