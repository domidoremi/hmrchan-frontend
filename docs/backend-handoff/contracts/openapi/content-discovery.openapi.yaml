openapi: 3.1.0
info:
  title: HMRChan Content / Discovery
  version: wave3-final
  description: |
    Canonical checked-in contract artifact for the Content / Discovery domain.
    Cursor collections in this domain return `items + next_cursor + has_more`.
    Aggregated read models such as `home`, `trends`, `community/highlights`, and `schedules/highlights`
    intentionally keep bespoke response shapes and do not expose collection totals.
servers:
  - url: /
tags:
  - name: home
  - name: posts
  - name: authors
  - name: media
  - name: search
  - name: schedules
  - name: trends
  - name: members
paths:
  /api/v1/home: { get: { tags: [home], responses: { "200": { description: Home aggregate } } } }
  /api/v1/home/featured: { get: { tags: [home], responses: { "200": { description: Featured home aggregate } } } }
  /api/v1/home/story-deck: { get: { tags: [home], responses: { "200": { description: Story deck aggregate } } } }
  /api/v1/posts/text/latest: { get: { tags: [posts], responses: { "200": { description: Latest text posts aggregate } } } }
  /api/v1/posts:
    get:
      tags: [posts]
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses: { "200": { description: Cursor collection } }
  /api/v1/posts/{id}: { get: { tags: [posts], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Post detail } } } }
  /api/v1/posts/light: { get: { tags: [posts], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/posts/mixed: { get: { tags: [posts], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/authors:
    get:
      tags: [authors]
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses: { "200": { description: Cursor collection } }
  /api/v1/authors/{id}: { get: { tags: [authors], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Author detail } } } }
  /api/v1/authors/{id}/posts: { get: { tags: [authors], parameters: [ { $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/media/{id}: { get: { tags: [media], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Media detail or redirect payload } } } }
  /api/v1/media/{id}/stream: { get: { tags: [media], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Media stream } } } }
  /api/v1/media/{id}/subtitle: { get: { tags: [media], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Subtitle payload } } } }
  /api/v1/media/{id}/thumbnail: { get: { tags: [media], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Thumbnail payload } } } }
  /api/v1/media/{id}/download: { get: { tags: [media], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Download stream } } } }
  /api/v1/search/posts: { get: { tags: [search], parameters: [ { name: q, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/search/authors: { get: { tags: [search], parameters: [ { name: q, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/search/suggestions: { get: { tags: [search], parameters: [ { name: q, in: query, schema: { type: string } } ], responses: { "200": { description: Search suggestions aggregate } } } }
  /api/v1/schedules:
    get:
      tags: [schedules]
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses: { "200": { description: Cursor collection } }
  /api/v1/schedules/calendar: { get: { tags: [schedules], responses: { "200": { description: Schedule calendar aggregate } } } }
  /api/v1/schedules/{id}: { get: { tags: [schedules], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Schedule detail } } } }
  /api/v1/schedules/highlights: { get: { tags: [schedules], responses: { "200": { description: Schedule highlights aggregate } } } }
  /api/v1/trends/summary: { get: { tags: [trends], responses: { "200": { description: Trends summary aggregate } } } }
  /api/v1/community/highlights: { get: { tags: [trends], responses: { "200": { description: Community highlights aggregate } } } }
  /api/v1/members:
    get:
      tags: [members]
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses: { "200": { description: Cursor collection } }
  /api/v1/members/{id}: { get: { tags: [members], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: Member detail } } } }
components:
  parameters:
    PathID: { name: id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
