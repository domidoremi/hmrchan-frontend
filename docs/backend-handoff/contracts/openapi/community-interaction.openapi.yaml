  /api/v1/discussions/comments/{id}/thread: { get: { tags: [discussions], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK } } } }
  /api/v1/discussions/comments/{id}/like: { post: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
