openapi: 3.1.0
info:
  title: HMRChan Community / Interaction
  version: wave2-final
  description: |
    Canonical checked-in contract artifact for the Community / Interaction domain.
    Cursor collections return `items + next_cursor + has_more`.
    `GET /api/v1/inbox/summary` returns unread counters plus `unread_count`.
    `PATCH /api/v1/inbox/preferences` uses JSON Merge Patch with top-level categories.
    Inbox status semantics are fixed: `all` = active non-archived, `unread` = active unread, `archived` = archived only.
servers:
  - url: /
tags:
  - name: favorites
  - name: community
  - name: comments
  - name: comment-images
  - name: discussions
  - name: relations
  - name: history
  - name: reports
  - name: inbox
  - name: support
paths:
  /api/v1/favorites/check/{post_id}: { get: { tags: [favorites], responses: { "200": { description: OK } } } }
  /api/v1/favorites:
    post: { tags: [favorites], security: [ { bearerAuth: [] } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
    get:
      tags: [favorites]
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } }
  /api/v1/favorites/summary: { get: { tags: [favorites], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/favorites/folders/list: { get: { tags: [favorites], security: [ { bearerAuth: [] } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/favorites/tags/list: { get: { tags: [favorites], security: [ { bearerAuth: [] } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/favorites/{id}:
    get: { tags: [favorites], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
    patch: { tags: [favorites], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], requestBody: { $ref: "#/components/requestBodies/JsonMergePatch" }, responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
    delete: { tags: [favorites], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
  /api/v1/community/stats: { get: { tags: [community], responses: { "200": { description: OK } } } }
  /api/v1/community/latest:
    get:
      tags: [community]
      description: |
        Latest public community comments. Uses the canonical cursor collection wire shape
        `{ items, next_cursor, has_more }` and never returns `total`.
        Identity/profile or content-card enrichment failures degrade to partial or empty items with `200`;
        only the main comment query returns `500`.
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses:
        "200": { description: Cursor collection }
        "400": { description: Invalid cursor }
        "500": { description: Comment query failed }
  /api/v1/community/hot:
    get:
      tags: [community]
      description: |
        Hot public posts ranked by recent community comment count.
        Ordered by `comment_count DESC, post_uuid DESC` and returned as the canonical
        cursor collection `{ items, next_cursor, has_more }`.
        Item fields are `post_id`, `comment_count`, `platform`, and optional `title`.
        This endpoint does not return `hot_topics` or `total`.
        Content-card enrichment failures degrade to partial or empty items with `200`;
        only the aggregate query returns `500`.
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/CommunityDays" } ]
      responses:
        "200": { description: Cursor collection }
        "400": { description: Invalid cursor or invalid days }
        "500": { description: Aggregate query failed }
  /api/v1/community/feed: { get: { tags: [community], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/community/my-comments: { get: { tags: [community], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/community/my-likes: { get: { tags: [community], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/community/favorites: { get: { tags: [community], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/community/summary: { get: { tags: [community], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/posts/{id}/comments:
    get:
      tags: [comments]
      description: |
        Strict cursor collection for post comments. Only `limit`, `cursor`, and `sort`
        are supported. Legacy page-based params such as `page` and `page_size` are rejected with `400`.
        Semantics are fixed:
        - missing post or missing content card => `404`
        - content service unavailable => `503`
        - existing post with no comments => `200` empty cursor collection
      parameters: [ { $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/CommentSort" } ]
      responses:
        "200": { description: Cursor collection }
        "400": { description: Invalid post ID, invalid cursor, or legacy page-based pagination params }
        "404": { description: Post or required content card not found }
        "503": { description: Content service unavailable }
    post: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
  /api/v1/comments/{id}: { patch: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], requestBody: { $ref: "#/components/requestBodies/JsonMergePatch" }, responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/comments/{id}/replies: { get: { tags: [comments], parameters: [ { $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/comments/{id}/thread: { get: { tags: [comments], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK } } } }
  /api/v1/comments/{id}/like: { post: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/comments/{id}/favorite: { post: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/comments/{id}/report: { post: { tags: [comments], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/comment-images: { post: { tags: [comment-images], security: [ { bearerAuth: [] } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/comment-images/{id}: { get: { tags: [comment-images], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [comment-images], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/discussions:
    get: { tags: [discussions], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } }
    post: { tags: [discussions], security: [ { bearerAuth: [] } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
  /api/v1/discussions/search: { get: { tags: [discussions], parameters: [ { name: q, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } } }
  /api/v1/discussions/{id}: { get: { tags: [discussions], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK } } }, patch: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], requestBody: { $ref: "#/components/requestBodies/JsonMergePatch" }, responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/discussions/{id}/comments: { get: { tags: [discussions], parameters: [ { $ref: "#/components/parameters/PathID" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection } } }, post: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/discussions/{id}/like: { post: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/discussions/my: { get: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/discussions/summary: { get: { tags: [discussions], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/discussions/comments/{id}: { get: { tags: [discussions], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK } } }, patch: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], requestBody: { $ref: "#/components/requestBodies/JsonMergePatch" }, responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [discussions], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
