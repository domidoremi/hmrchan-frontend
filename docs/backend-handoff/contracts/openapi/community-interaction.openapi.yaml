  /api/v1/history/search: { post: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, get: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/summary: { get: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/search/{id}: { delete: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/browsing: { post: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, get: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }, delete: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/browsing/{id}: { delete: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/all: { delete: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "204": { description: No Content }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/stats: { get: { tags: [history], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/my-comments: { get: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/my-likes: { get: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/history/my-comment-favorites: { get: { tags: [history], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/reports: { post: { tags: [reports], security: [ { bearerAuth: [] } ], responses: { "201": { description: Created }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/reports/my: { get: { tags: [reports], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/reports/summary: { get: { tags: [reports], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/inbox:
    get:
      tags: [inbox]
      parameters:
        - { $ref: "#/components/parameters/InboxLimit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/InboxCategory" }
        - { $ref: "#/components/parameters/InboxStatus" }
      security: [ { bearerAuth: [] } ]
      responses: { "200": { description: Cursor collection }, "426": { $ref: "#/components/responses/UpgradeRequired" } }
  /api/v1/inbox/summary: { get: { tags: [inbox], security: [ { bearerAuth: [] } ], responses: { "200": { description: Summary with unread_count }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/inbox/preferences:
    get: { tags: [inbox], security: [ { bearerAuth: [] } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } }
    patch:
      tags: [inbox]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: true
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses: { "200": { description: OK }, "400": { description: Bad Request }, "426": { $ref: "#/components/responses/UpgradeRequired" } }
  /api/v1/inbox/{id}/read: { patch: { tags: [inbox], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/inbox/read-all: { post: { tags: [inbox], security: [ { bearerAuth: [] } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/inbox/{id}/archive: { patch: { tags: [inbox], security: [ { bearerAuth: [] } ], parameters: [ { $ref: "#/components/parameters/PathID" } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/inbox/archive-read: { post: { tags: [inbox], security: [ { bearerAuth: [] } ], responses: { "200": { description: OK }, "426": { $ref: "#/components/responses/UpgradeRequired" } } } }
  /api/v1/inbox/stream:
    get:
      tags: [inbox]
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: SSE stream with `snapshot`, `message.created`, `message.updated`, `summary.updated`, `heartbeat`
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/feedback: { post: { tags: [support], responses: { "201": { description: Created } } } }
  /api/v1/contact/send: { post: { tags: [support], responses: { "201": { description: Created } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathID: { name: id, in: path, required: true, schema: { type: string } }
    PostID: { name: post_id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    CommunityDays: { name: days, in: query, schema: { type: integer, default: 7, minimum: 1, maximum: 90 } }
    CommentSort: { name: sort, in: query, schema: { type: string, enum: [newest, oldest, popular], default: popular } }
    InboxLimit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
    InboxCategory: { name: category, in: query, schema: { type: string, enum: [interaction, security, system] } }
    InboxStatus: { name: status, in: query, schema: { type: string, enum: [all, unread, archived] } }
