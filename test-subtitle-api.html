<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字幕 API 测试</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 4px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background: #0056b3;
      }
      pre {
        background: #282c34;
        color: #abb2bf;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
      }
      .success {
        color: #28a745;
      }
      .error {
        color: #dc3545;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎬 MomiChan 字幕 API 测试</h1>

      <div class="test-section">
        <h2>测试 1: 获取帖子详情（包含字幕元数据）</h2>
        <button onclick="testPostDetail()">测试帖子 API</button>
        <div id="post-result"></div>
      </div>

      <div class="test-section">
        <h2>测试 2: 获取字幕文件</h2>
        <button onclick="testSubtitle('zh-Hans')">简体中文</button>
        <button onclick="testSubtitle('zh-Hant')">繁體中文</button>
        <button onclick="testSubtitle('en')">English</button>
        <button onclick="testSubtitle('ja')">日本語</button>
        <button onclick="testSubtitle(null)">默认字幕</button>
        <div id="subtitle-result"></div>
      </div>

      <div class="test-section">
        <h2>测试 3: 视频播放器字幕测试</h2>
        <div id="video-container"></div>
      </div>
    </div>

    <script>
      const API_BASE = 'https://api.momichan.xyz/api/v1'
      const TEST_POST_ID = '84c2d1f8-47a8-4309-a297-de83b91772f5' // 后端测试的帖子 ID
      const TEST_MEDIA_ID = '657a8528-090f-40fa-a779-83c5f098bde6' // 后端测试的媒体 ID

      async function testPostDetail() {
        const resultDiv = document.getElementById('post-result')
        resultDiv.innerHTML = '<p>加载中...</p>'

        try {
          const response = await fetch(`${API_BASE}/posts/${TEST_POST_ID}`)
          const data = await response.json()

          if (response.ok) {
            const mediaFiles = data.media_files || []
            const videoWithSubtitle = mediaFiles.find(
              (m) => m.file_type === 'video' && m.has_subtitle
            )

            resultDiv.innerHTML = `
            <p class="success">✅ 成功获取帖子详情</p>
            <p><strong>媒体文件数量:</strong> ${mediaFiles.length}</p>
            <p><strong>带字幕的视频:</strong> ${videoWithSubtitle ? '是' : '否'}</p>
            ${
              videoWithSubtitle
                ? `
              <p><strong>字幕语言:</strong> ${videoWithSubtitle.subtitle_language}</p>
              <p><strong>字幕格式:</strong> ${videoWithSubtitle.subtitle_format}</p>
              <p><strong>可用字幕:</strong></p>
              <pre>${JSON.stringify(videoWithSubtitle.subtitles, null, 2)}</pre>
            `
                : ''
            }
            <details>
              <summary>完整响应</summary>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </details>
          `
          } else {
            resultDiv.innerHTML = `<p class="error">❌ 错误: ${data.message || response.statusText}</p>`
          }
        } catch (error) {
          resultDiv.innerHTML = `<p class="error">❌ 请求失败: ${error.message}</p>`
        }
      }

      async function testSubtitle(language) {
        const resultDiv = document.getElementById('subtitle-result')
        const url = language
          ? `${API_BASE}/media/${TEST_MEDIA_ID}/subtitle?language=${language}`
          : `${API_BASE}/media/${TEST_MEDIA_ID}/subtitle`

        resultDiv.innerHTML = `<p>加载中... <code>${url}</code></p>`

        try {
          const response = await fetch(url)
          const text = await response.text()

          if (response.ok) {
            const preview = text.substring(0, 500)
            resultDiv.innerHTML = `
            <p class="success">✅ 成功获取字幕 ${language ? `(${language})` : '(默认)'}</p>
            <p><strong>Content-Type:</strong> ${response.headers.get('content-type')}</p>
            <p><strong>字幕预览:</strong></p>
            <pre>${preview}${text.length > 500 ? '\n...(省略)' : ''}</pre>
          `
          } else {
            resultDiv.innerHTML = `<p class="error">❌ 错误 ${response.status}: ${text}</p>`
          }
        } catch (error) {
          resultDiv.innerHTML = `<p class="error">❌ 请求失败: ${error.message}</p>`
        }
      }

      async function createVideoPlayer() {
        const container = document.getElementById('video-container')

        try {
          const response = await fetch(`${API_BASE}/posts/${TEST_POST_ID}`)
          const data = await response.json()

          if (!response.ok) {
            container.innerHTML = `<p class="error">无法加载视频数据</p>`
            return
          }

          const videoMedia = data.media_files?.find(
            (m) => m.file_type === 'video' && m.has_subtitle
          )

          if (!videoMedia) {
            container.innerHTML = `<p class="error">该帖子没有带字幕的视频</p>`
            return
          }

          const subtitles = videoMedia.subtitles || []
          const trackElements = subtitles
            .map((sub) => {
              const url = `${API_BASE}/media/${videoMedia.id}/subtitle?language=${sub.language}`
              return `<track kind="subtitles" label="${sub.label || sub.language}" srclang="${sub.language}" src="${url}">`
            })
            .join('\n        ')

          container.innerHTML = `
          <video controls width="100%" style="max-width: 800px; border-radius: 8px;">
            <source src="${API_BASE}/media/${videoMedia.id}/stream" type="video/mp4">
            ${trackElements}
            您的浏览器不支持视频播放。
          </video>
          <p><strong>提示:</strong> 点击视频右下角的 CC 按钮选择字幕语言</p>
          <details>
            <summary>字幕数据</summary>
            <pre>${JSON.stringify(subtitles, null, 2)}</pre>
          </details>
        `
        } catch (error) {
          container.innerHTML = `<p class="error">❌ 创建播放器失败: ${error.message}</p>`
        }
      }

      // 页面加载时自动创建视频播放器
      window.addEventListener('DOMContentLoaded', createVideoPlayer)
    </script>
  </body>
</html>
