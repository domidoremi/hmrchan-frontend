<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <!-- PWA - Modern standard -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA - Legacy Apple support (deprecated but still needed for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HMRChan" />

    <!-- Viewport - Mobile-first responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Social Meta Tags -->
    <meta
      name="description"
      content="himeri chan - Modern Social Media Content Aggregation System"
    />
    <meta name="theme-color" content="#8b5cf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />

    <!-- Performance Optimization: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="http://localhost:8000" />
    <link rel="preconnect" href="http://localhost:8000" crossorigin />

    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />

    <title>himeri chan - Hub</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
