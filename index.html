<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/icons/sitting-32.webp" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon (180x180 per Apple HIG) -->
    <link rel="apple-touch-icon" href="/icons/sitting-180.webp" />
    <!-- PWA - Modern standard -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA - Legacy Apple support (deprecated but still needed for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MomiChan" />

    <!-- Viewport - Mobile-first responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Social Meta Tags -->
    <meta
      name="description"
      content="MomiChan is a fan hub for Momiyama Himeri, bringing together the latest YouTube, X, TikTok, and Instagram updates in one place."
    />
    <meta
      name="keywords"
      content="籾山ひめり, 高嶺のなでしこ, アイドル, YouTube, Twitter, TikTok, Instagram, SNS"
    />
    <meta name="author" content="MomiChan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://momichan.xyz/" />
    <script type="application/json" data-prerender-structured-data="true"></script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://momichan.xyz/" />
    <meta property="og:title" content="MomiChan - Momiyama Himeri Fan Hub" />
    <meta
      property="og:description"
      content="Follow Momiyama Himeri across YouTube, X, TikTok, and Instagram from one fan hub."
    />
    <meta property="og:image" content="https://momichan.xyz/icons/sitting-512.webp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MomiChan - Momiyama Himeri Fan Hub" />
    <meta
      name="twitter:description"
      content="Follow Momiyama Himeri across YouTube, X, TikTok, and Instagram from one fan hub."
    />
    <meta name="twitter:image" content="https://momichan.xyz/icons/sitting-512.webp" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Performance Optimization: DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.momichan.xyz" />

    <!-- 预加载关键 CSS（由 Vite 自动注入，这里仅作标记） -->
    <!-- Critical CSS 会在构建时内联到 HTML 中 -->

    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />

    <title>MomiChan - Momiyama Himeri Fan Hub</title>

    <!-- 动态标题将由 Vue Router 管理 -->

    <style>
      html[data-js='1']
        [data-prerender-shell='true'][data-prerender-shell-variant='home']
        [data-prerender-shell-content='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>

    <!--
      点击劫持防御 — 第一阶段（同步 JS）
      服务端已有 X-Frame-Options + CSP frame-ancestors，此处只做前端兜底：
      - 仅在 iframe 内嵌时隐藏页面并尝试跳出
      - 顶层访问不再默认隐藏，避免影响首屏渲染
    -->
    <!-- 替换原来的两个 script 为下面这个（仍然放在 <head> 末尾） -->
    <script defer>
      // 1. 点击劫持防御（顶层判断）
      if (window.self !== window.top) {
        document.documentElement.style.display = 'none'
        try {
          window.top.location.href = window.self.location.href
        } catch (e) {}
      }

      // 2. prerender shell 清理
      document.documentElement.setAttribute('data-js', '1')
      setTimeout(() => {
        const appRoot = document.getElementById('app-root')
        if (!appRoot || !appRoot.hasAttribute('data-v-app')) {
          document.documentElement.removeAttribute('data-js')
        }
      }, 4000)
    </script>
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
