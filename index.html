<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#fbf9ef" />
    <script data-hmr-theme-bootstrap>
      ;(() => {
        const normalizeTheme = (value) => {
          if (value === 'minimal-light') return 'light'
          if (value === 'minimal-dark') return 'dark'
          return value === 'light' || value === 'dark' || value === 'system' ? value : null
        }
        const resolveSystemTheme = () =>
          window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ? 'dark' : 'light'
        let theme = 'system'
        try {
          theme = normalizeTheme(window.localStorage?.getItem('hmr.theme')) || 'system'
        } catch {
          theme = 'system'
        }
        const resolvedTheme = theme === 'system' ? resolveSystemTheme() : theme
        const root = document.documentElement
        root.dataset.theme = resolvedTheme
        root.dataset.themeMode = theme
        root.style.colorScheme = resolvedTheme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', resolvedTheme === 'dark' ? '#11100f' : '#fbf9ef')
      })()
    </script>
    <style id="hmr-theme-critical">
      html {
        --hmr-critical-bg: #fbf9ef;
        --hmr-critical-base: #171412;
        background: var(--hmr-critical-bg);
        color: var(--hmr-critical-base);
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --hmr-critical-bg: #11100f;
        --hmr-critical-base: #f7efe3;
        color-scheme: dark;
      }

      body,
      #app-root {
        background: var(--hmr-critical-bg);
        color: var(--hmr-critical-base);
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="MomiChan 汇集公开媒体、社区讨论、日程和创作者信号。" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="MomiChan" />
    <meta property="og:description" content="浏览 MomiChan 媒体、社区、日程和创作者信号。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/sitting-512.webp" />
    <link rel="icon" href="/icons/sitting-32.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MomiChan</title>
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.entry.ts"></script>
  </body>
</html>
