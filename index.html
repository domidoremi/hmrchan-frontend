<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/icons/sitting-32.webp" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon (180x180 per Apple HIG) -->
    <link rel="apple-touch-icon" href="/icons/sitting-180.webp" />
    <!-- PWA - Modern standard -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA - Legacy Apple support (deprecated but still needed for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MomiChan" />

    <!-- Viewport - Mobile-first responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Social Meta Tags -->
    <meta
      name="description"
      content="MomiChan - 籾山ひめりのソーシャルメディアコンテンツを一括管理。YouTube、X(Twitter)、TikTok、Instagramの最新投稿をチェック。"
    />
    <meta
      name="keywords"
      content="籾山ひめり, 高嶺のなでしこ, アイドル, YouTube, Twitter, TikTok, Instagram, SNS"
    />
    <meta name="author" content="MomiChan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://momichan.xyz/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://momichan.xyz/" />
    <meta property="og:title" content="MomiChan - 籾山ひめり Fan Hub" />
    <meta property="og:description" content="籾山ひめりのソーシャルメディアコンテンツを一括管理" />
    <meta property="og:image" content="https://momichan.xyz/icons/sitting-512.webp" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MomiChan - 籾山ひめり Fan Hub" />
    <meta name="twitter:description" content="籾山ひめりのソーシャルメディアコンテンツを一括管理" />
    <meta name="twitter:image" content="https://momichan.xyz/icons/sitting-512.webp" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Performance Optimization: DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.momichan.xyz" />

    <!-- 预加载关键 CSS（由 Vite 自动注入，这里仅作标记） -->
    <!-- Critical CSS 会在构建时内联到 HTML 中 -->

    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />

    <title>MomiChan - 籾山ひめり Fan Hub</title>

    <!-- 动态标题将由 Vue Router 管理 -->

    <!--
      点击劫持防御 — 第一阶段（同步 JS）
      服务端已有 X-Frame-Options + CSP frame-ancestors，此处只做前端兜底：
      - 仅在 iframe 内嵌时隐藏页面并尝试跳出
      - 顶层访问不再默认隐藏，避免影响首屏渲染
    -->
    <script>
      (function(){
        if(window.self!==window.top){
          document.documentElement.style.display='none'
          try{window.top.location.href=window.self.location.href}catch(e){}
        }
      })()
    </script>
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
