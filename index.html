<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <!-- PWA - Modern standard -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA - Legacy Apple support (deprecated but still needed for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HMRChan" />

    <!-- Viewport - Mobile-first responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Social Meta Tags -->
    <meta
      name="description"
      content="Himenshion Club - 籾山ひめりのソーシャルメディアコンテンツを一括管理。YouTube、Twitter、TikTok、Instagramの最新投稿をチェック。"
    />
    <meta
      name="keywords"
      content="籾山ひめり, 高嶺のなでしこ, アイドル, YouTube, Twitter, TikTok, Instagram, SNS"
    />
    <meta name="author" content="Himenshion Club" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://himenshion.club/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://himenshion.club/" />
    <meta property="og:title" content="Himenshion Club - 籾山ひめり Fan Hub" />
    <meta property="og:description" content="籾山ひめりのソーシャルメディアコンテンツを一括管理" />
    <meta property="og:image" content="https://himenshion.club/og-image.png" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Himenshion Club - 籾山ひめり Fan Hub" />
    <meta name="twitter:description" content="籾山ひめりのソーシャルメディアコンテンツを一括管理" />
    <meta name="twitter:image" content="https://himenshion.club/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#8b5cf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />

    <!-- Performance Optimization: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://api.momichan.xyz" />
    <link rel="preconnect" href="https://api.momichan.xyz" crossorigin />

    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />

    <title>himeri chan - Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
