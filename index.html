<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon (180x180 per Apple HIG) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <!-- PWA - Modern standard -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PWA - Legacy Apple support (deprecated but still needed for older iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MomiChan" />

    <!-- Viewport - Mobile-first responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Social Meta Tags -->
    <meta
      name="description"
      content="MomiChan - 籾山ひめりのソーシャルメディアコンテンツを一括管理。YouTube、X(Twitter)、TikTok、Instagramの最新投稿をチェック。"
    />
    <meta
      name="keywords"
      content="籾山ひめり, 高嶺のなでしこ, アイドル, YouTube, Twitter, TikTok, Instagram, SNS"
    />
    <meta name="author" content="MomiChan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://momichan.xyz/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://momichan.xyz/" />
    <meta property="og:title" content="MomiChan - 籾山ひめり Fan Hub" />
    <meta property="og:description" content="籾山ひめりのソーシャルメディアコンテンツを一括管理" />
    <meta property="og:image" content="https://momichan.xyz/icons/icon-512x512.png" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MomiChan - 籾山ひめり Fan Hub" />
    <meta name="twitter:description" content="籾山ひめりのソーシャルメディアコンテンツを一括管理" />
    <meta name="twitter:image" content="https://momichan.xyz/icons/icon-512x512.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />

    <!-- Performance Optimization: DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://api.momichan.xyz" />
    <link rel="preconnect" href="https://api.momichan.xyz" crossorigin />

    <!-- 预连接第三方头像服务，减少延迟 -->
    <link rel="dns-prefetch" href="https://api.dicebear.com" />
    <link rel="preconnect" href="https://api.dicebear.com" crossorigin />

    <!-- 预加载关键 CSS（由 Vite 自动注入，这里仅作标记） -->
    <!-- Critical CSS 会在构建时内联到 HTML 中 -->

    <!-- Accessibility -->
    <meta name="color-scheme" content="light dark" />

    <title>MomiChan - 籾山ひめり Fan Hub</title>

    <!-- 动态标题将由 Vue Router 管理 -->

    <!--
      点击劫持防御 — 第一阶段（CSS + 同步 JS）
      在任何内容渲染前执行：
      1. CSS 默认隐藏 html，防止 iframe 内闪现内容
      2. 同步脚本检测 iframe 嵌入 → 跳出或保持隐藏
      3. 非 iframe → 立即移除隐藏样式，零感知
      服务端已有 X-Frame-Options + CSP frame-ancestors，此为纵深防御降级方案
    -->
    <style id="frame-guard">html{display:none!important}</style>
    <script>
      (function(){
        if(window.self===window.top){
          document.getElementById('frame-guard').remove();
          return
        }
        try{window.top.location.href=window.self.location.href}catch(e){}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Cloudflare Web Analytics — 手动引入外部脚本，避免自动注入内联脚本导致 CSP 哈希频繁变化 -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "2aead0e284cb41faa7612e264ecbb1ac"}'></script>
  </body>
</html>
