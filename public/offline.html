<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22c55e" />
    <title>离线模式 - MomiChan</title>
    <style>
      :root {
        --primary: #22c55e;
        --primary-dark: #16a34a;
        --bg-gradient-start: #0f172a;
        --bg-gradient-end: #1e293b;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.9);
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.2);
        --success: #4ade80;
        --warning: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol',
          'Noto Color Emoji';
        min-height: 100svh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          var(--bg-gradient-start) 0%,
          var(--bg-gradient-end) 100%
        );
        color: var(--text-primary);
        padding: 1.5rem;
        line-height: 1.6;
      }

      .container {
        max-width: 540px;
        width: 100%;
        text-align: center;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 2rem;
      }

      .icon {
        font-size: 6rem;
        animation: float 3s ease-in-out infinite;
        filter: drop-shadow(0 10px 20px var(--shadow));
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-15px) rotate(-5deg);
        }
        75% {
          transform: translateY(-10px) rotate(5deg);
        }
      }

      .pulse-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120px;
        height: 120px;
        border: 3px solid var(--text-primary);
        border-radius: 50%;
        opacity: 0;
        animation: pulse 2s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.5);
          opacity: 0;
        }
      }

      h1 {
        font-size: clamp(2rem, 5vw, 2.75rem);
        margin-bottom: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .subtitle {
        font-size: clamp(1.125rem, 3vw, 1.375rem);
        margin-bottom: 2.5rem;
        opacity: 0.95;
        font-weight: 400;
      }

      .actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 2rem;
      }

      button {
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border: 2px solid var(--text-primary);
        background: var(--glass-bg);
        color: var(--text-primary);
        border-radius: 0.75rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        min-width: 140px;
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
        opacity: 0;
        transition: opacity 0.3s;
      }

      button:hover::before {
        opacity: 1;
      }

      button:hover {
        background: var(--text-primary);
        color: var(--primary);
        transform: translateY(-3px);
        box-shadow: 0 12px 24px var(--shadow);
      }

      button:active {
        transform: translateY(-1px);
        box-shadow: 0 6px 12px var(--shadow);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .tip {
        margin-top: 2.5rem;
        padding: 1.25rem;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 1rem;
        font-size: 0.9375rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-align: left;
      }

      .tip-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .tip-content {
        opacity: 0.9;
        line-height: 1.6;
      }

      .status-card {
        margin-top: 2rem;
        padding: 1rem;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 0.75rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-size: 0.9375rem;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        animation: blink 2s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .status-online {
        background: var(--success);
        box-shadow: 0 0 12px var(--success);
      }

      .status-offline {
        background: var(--warning);
        box-shadow: 0 0 12px var(--warning);
      }

      .status-text {
        font-weight: 500;
      }

      /* Responsive layout */
      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        .icon {
          font-size: 4.5rem;
        }

        .actions {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }

      /* Dark color scheme */
      @media (prefers-color-scheme: dark) {
        :root {
          --glass-bg: rgba(255, 255, 255, 0.15);
          --glass-border: rgba(255, 255, 255, 0.25);
        }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-wrapper">
        <div class="pulse-ring"></div>
        <div class="icon" role="img" aria-label="离线图标">📡</div>
      </div>

      <h1>网络连接已断开</h1>
      <p class="subtitle">看起来您当前处于离线状态，请检查网络连接后重试</p>

      <div class="actions">
        <button id="reloadBtn" onclick="handleReload()" aria-label="重新加载页面">
          🔄 重新加载
        </button>
        <button onclick="handleGoBack()" aria-label="返回上一页">← 返回上一页</button>
      </div>

      <div class="tip">
        <div class="tip-title">
          <span>💡</span>
          <strong>离线提示</strong>
        </div>
        <div class="tip-content">
          某些内容可能已缓存在本地，您可以继续浏览已访问过的页面。当网络恢复后，页面将自动重新加载。
        </div>
      </div>

      <div class="status-card" role="status" aria-live="polite">
        <div id="statusIndicator" class="status-indicator status-offline"></div>
        <span class="status-text">网络状态: <span id="statusText">离线</span></span>
      </div>
    </div>

    <script>
      let reloadAttempts = 0
      const MAX_RELOAD_ATTEMPTS = 3

      function updateOnlineStatus() {
        const statusText = document.getElementById('statusText')
        const statusIndicator = document.getElementById('statusIndicator')
        const reloadBtn = document.getElementById('reloadBtn')

        if (navigator.onLine) {
          statusText.textContent = '在线'
          statusIndicator.className = 'status-indicator status-online'

          // Keep automatic reloads bounded when connectivity returns.
          if (reloadAttempts < MAX_RELOAD_ATTEMPTS) {
            reloadAttempts++
            reloadBtn.disabled = true
            reloadBtn.textContent = `⏳ 正在重新加载... (${reloadAttempts}/${MAX_RELOAD_ATTEMPTS})`

            setTimeout(() => {
              window.location.reload()
            }, 1000)
          }
        } else {
          statusText.textContent = '离线'
          statusIndicator.className = 'status-indicator status-offline'
          reloadBtn.disabled = false
          reloadBtn.textContent = '🔄 重新加载'
        }
      }

      function handleReload() {
        if (navigator.onLine) {
          window.location.reload()
        } else {
          // A HEAD probe distinguishes stale online state from real reachability.
          fetch('/', { method: 'HEAD', cache: 'no-cache' })
            .then(() => {
              window.location.reload()
            })
            .catch(() => {
              alert('网络仍然不可用，请稍后再试')
            })
        }
      }

      function handleGoBack() {
        if (window.history.length > 1) {
          window.history.back()
        } else {
          window.location.href = '/'
        }
      }

      window.addEventListener('online', updateOnlineStatus)
      window.addEventListener('offline', updateOnlineStatus)

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          updateOnlineStatus()
        }
      })

      updateOnlineStatus()

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
          e.preventDefault()
          handleReload()
        }
        if (e.key === 'Escape') {
          handleGoBack()
        }
      })
    </script>
  </body>
</html>
